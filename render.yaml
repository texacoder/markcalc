# Free deployment on Render (https://render.com). Render → New → Blueprint → pick this repo.
# Render asks for the values marked `sync: false` (see docs/SETUP.md for where to get them).
services:
  - type: web
    name: markcalc
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Free AI key from https://aistudio.google.com/app/apikey
      - key: GEMINI_API_KEY
        sync: false
      # Free Turso database (https://turso.tech): URL like libsql://markcalc-yourname.turso.io
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      # Optional: teachers must enter this code to sign up
      - key: SIGNUP_CODE
        sync: false
      - key: DAILY_GRADING_LIMIT
        value: "40"
