# Free deployment on Render (https://render.com). Render → New → Blueprint → pick this repo.
# Render asks for the values marked `sync: false` (see docs/SETUP.md for where to get them).
services:
  - type: web
    name: markcalc
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # AI for marking. Fill in ONE of these two (leave the other empty):
      # Free GitHub token with the "Models" permission: https://github.com/settings/personal-access-tokens/new
      - key: GITHUB_MODELS_TOKEN
        sync: false
      # Free Google Gemini key (needs a Google Cloud project): https://aistudio.google.com/app/apikey
      - key: GEMINI_API_KEY
        sync: false
      # Free database. Either Neon Postgres (https://neon.tech): postgresql://…?sslmode=require
      # or Turso (https://turso.tech): libsql://markcalc-yourname.turso.io
      - key: DATABASE_URL
        sync: false
      # Only for Turso. Leave empty for Neon.
      - key: DATABASE_AUTH_TOKEN
        sync: false
      # Optional: teachers must enter this code to sign up
      - key: SIGNUP_CODE
        sync: false
      - key: DAILY_GRADING_LIMIT
        value: "40"
