# Free deployment on Render (https://render.com). Render → New → Blueprint → pick this repo.
# No database is needed: nothing is stored.
services:
  - type: web
    name: markcalc
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # AI for marking. Fill in ONE (leave the others empty):
      # Free Groq key (sign in with GitHub or Google): https://console.groq.com/keys
      - key: GROQ_API_KEY
        sync: false
      # Free OpenRouter key: https://openrouter.ai/keys
      - key: OPENROUTER_API_KEY
        sync: false
      # Free Google Gemini key (needs a Google Cloud project): https://aistudio.google.com/app/apikey
      - key: GEMINI_API_KEY
        sync: false
      # Answer sheets one device can mark per day
      - key: PER_DEVICE_DAILY_LIMIT
        value: "15"
